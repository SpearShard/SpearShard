name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D contribution world
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#00d9ff&color_dots=#07131c,#063d52,#007c9b,#00b8d4,#00d9ff
            assets/snake-light.svg?palette=github-light&color_snake=#007c9b&color_dots=#ebf8ff,#c8eff7,#8edbe9,#3bbbd0,#007c9b

      - name: Generate profile data cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,lifetime,contributions,composition,rhythm,languages
          output-dir: assets/profile
          themes: light,dark
          commit: false

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add assets profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile visuals"
            git push
          fi