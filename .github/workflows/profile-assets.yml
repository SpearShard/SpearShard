name: Generate Profile Visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#00d9ff&color_dots=#07131c,#063d52,#007c9b,#00b8d4,#00d9ff
            assets/snake-light.svg?palette=github-light&color_snake=#007c9b&color_dots=#ebf8ff,#c8eff7,#8edbe9,#3bbbd0,#007c9b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,lifetime,contributions,composition,rhythm,languages
          output-dir: assets/profile
          themes: dark
          commit: false

      - name: Show generated files
        run: |
          echo "=============================="
          echo "GENERATED PROFILE FILES"
          echo "=============================="

          echo ""
          echo "Repository:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "3D contribution files:"
          find profile-3d-contrib -type f 2>/dev/null | sort || true

          echo ""
          echo "Profile assets:"
          find assets -type f 2>/dev/null | sort || true

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .

          if git diff --cached --quiet; then
            echo "No generated changes detected."
          else
            git commit -m "chore: update profile visuals"
            git push
          fi